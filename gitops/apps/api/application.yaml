apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-desk-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Atique7865/3-tier-application.git
    targetRevision: main
    path: gitops/apps/api
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-desk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true


