apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-db-data
  labels:
    app.kubernetes.io/part-of: campus-desk
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-db
  labels:
    app: student-db
    app.kubernetes.io/part-of: campus-desk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: student-db
  template:
    metadata:
      labels:
        app: student-db
        app.kubernetes.io/part-of: campus-desk
    spec:
      containers:
        - name: mysql
          image: quay.io/sclorg/mysql-84-c9s:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_DATABASE
              value: student_management
            - name: MYSQL_USER
              value: student_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql/data
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: student-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: student-db
  labels:
    app.kubernetes.io/part-of: campus-desk
spec:
  selector:
    app: student-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP

