apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-desk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Atique7865/3-tier-application.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true


